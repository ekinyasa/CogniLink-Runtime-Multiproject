[[env.production.analytics_engine_datasets]]
binding = "AE_CONVERSION"
dataset = "cognilink_runtime_conversion_prod" # NOTE: Create dataset via Wrangler or Dashboard

[[env.production.analytics_engine_datasets]]
binding = "AE_TRAFFIC"
dataset = "cognilink_runtime_traffic_prod" # NOTE: Create dataset via Wrangler or Dashboard

[[env.production.analytics_engine_datasets]]
binding = "AE_EXPERIMENT"
dataset = "cognilink_runtime_experiment_prod" # NOTE: Create dataset via Wrangler or Dashboard

[env.production.vars]
ENV_NAME = "production"
GA4_ID = "" # REPLACE GA4_ID
META_PIXEL_ID = "" # REPLACE META_PIXEL_ID
