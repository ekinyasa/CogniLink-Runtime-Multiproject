name = "cognilink-runtime-pages"
pages_build_output_dir = "./public"
compatibility_date = "2024-09-23"

# ==============================================================================
# DEV ENVIRONMENT : LOCAL & PREVIEW
# ==============================================================================
# NOTE: To use these on local dev or preview branches, uncomment and supply proper IDs. 
# Cloudflare requires valid 32-character 'id' fields for KV bindings in wrangler.toml 
# if they are active here. Otherwise, you can bind them in the CF Dashboard.

[vars]
ENV_NAME = "dev"
GA4_ID = "" # REPLACE GA4_ID
META_PIXEL_ID = "" # REPLACE META_PIXEL_ID

# ==============================================================================
# PRODUCTION ENVIRONMENT
# ==============================================================================
[env.production]

[[env.production.kv_namespaces]]
binding = "SLUG_LINKS"
id = "cognilink_runtime_slug_links" 

[[env.production.kv_namespaces]]
binding = "CAMPAIGN_INDEX"
id = "cognilink_rt_campaign_index" 

[[env.production.kv_namespaces]]
binding = "LANDING_CONFIG"
id = "cognilink_rt_landing_config" 

[[env.production.kv_namespaces]]
binding = "CAMPAIGN_AB_ALIAS_INDEX"
id = "cognilink_rt_camp_ab_index" 

[[env.production.kv_namespaces]]
binding = "AB_INDEX"
id = "cognilink_runtime_ab_index" 

[[env.production.kv_namespaces]]
binding = "ROUTE_ALIAS"
id = "cognilink_runtime_route_alias" 

[[env.production.kv_namespaces]]
binding = "APP_CONFIG"
id = "cognilink_runtime_app_config" 

[[env.production.kv_namespaces]]
binding = "ANALYTICS_DATA"
id = "cognilink_rt_analytics_data" 

[[env.production.kv_namespaces]]
binding = "GUARD_CACHE"
id = "cognilink_runtime_guard_cache"  

[[env.production.analytics_engine_datasets]]
binding = "AE_CONVERSION"
dataset = "cognilink_runtime_conversion_prod" # NOTE: Create dataset via Wrangler or Dashboard

[[env.production.analytics_engine_datasets]]
binding = "AE_TRAFFIC"
dataset = "cognilink_runtime_traffic_prod" # NOTE: Create dataset via Wrangler or Dashboard

[[env.production.analytics_engine_datasets]]
binding = "AE_EXPERIMENT"
dataset = "cognilink_runtime_experiment_prod" # NOTE: Create dataset via Wrangler or Dashboard

[env.production.vars]
ENV_NAME = "production"
GA4_ID = "" # REPLACE GA4_ID
META_PIXEL_ID = "" # REPLACE META_PIXEL_ID
