name = "cognilink-runtime-pages"
pages_build_output_dir = "./public"
compatibility_date = "2024-09-23"

# ==============================================================================
# DEV ENVIRONMENT : LOCAL & PREVIEW
# ==============================================================================
# NOTE: To use these on local dev or preview branches, uncomment and supply proper IDs. 
# Cloudflare requires valid 32-character 'id' fields for KV bindings in wrangler.toml 
# if they are active here. Otherwise, you can bind them in the CF Dashboard.

[vars]
ENV_NAME = "dev"
GA4_ID = "" # REPLACE GA4_ID
META_PIXEL_ID = "" # REPLACE META_PIXEL_ID
RUNTIME_CONTEXT_READ_ENABLED = "true"
SHADOW_TELEMETRY_ENABLED = "false"
SHADOW_TELEMETRY_SAMPLE_RATE = "0.1"

# ==============================================================================
# PRODUCTION ENVIRONMENT
# ==============================================================================
[env.production]

[[env.production.kv_namespaces]]
binding = "SLUG_LINKS"
id = "281632c6f5f1457db9e04ee79d979929" 

[[env.production.kv_namespaces]]
binding = "CAMPAIGN_INDEX"
id = "172ef04f783640228c68d3fd321ed33d" 

[[env.production.kv_namespaces]]
binding = "LANDING_CONFIG"
id = "b44f1b0e907a4649b9f0c28fd849ac36" 

[[env.production.kv_namespaces]]
binding = "CAMPAIGN_AB_ALIAS_INDEX"
id = "f76395da9009447dbd630acef12b522c" 

[[env.production.kv_namespaces]]
binding = "AB_INDEX"
id = "eafe5cfff45f40738c8bd7aba82e05ac" 

[[env.production.kv_namespaces]]
binding = "ROUTE_ALIAS"
id = "bc3f8583acb3480dbe9ba84d97612593" 

[[env.production.kv_namespaces]]
binding = "APP_CONFIG"
id = "2ff9d0424c9442a2919f60885097e017" 

[[env.production.kv_namespaces]]
binding = "ANALYTICS_DATA"
id = "2034dc1f7c3243f382e5ed9a7e6d1dd9" 

[[env.production.kv_namespaces]]
binding = "GUARD_CACHE"
id = "7b9bb0d4c1b44c6797f8d328f1b64600" 

