[env.production.vars]
ENV_NAME = "production"
GA4_ID = "" # REPLACE GA4_ID
META_PIXEL_ID = "" # REPLACE META_PIXEL_ID
RUNTIME_CONTEXT_READ_ENABLED = "true"
SHADOW_TELEMETRY_ENABLED = "true"
SHADOW_TELEMETRY_SAMPLE_RATE = "1"
